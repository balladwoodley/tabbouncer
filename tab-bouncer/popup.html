<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Bouncer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
    --red: #ff453a;
    --orange: #ff9500;
    --green: #30d158;
    --accent: #ff453a;
  }

  body {
    width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, #1a0a0a 0%, #0f0f0f 60%);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255,69,58,0.15) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 4px;
  }
  .logo-icon {
    font-size: 22px;
    line-height: 1;
    filter: drop-shadow(0 0 8px rgba(255,69,58,0.5));
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-3px) rotate(-10deg); }
  }
  .logo-text {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .logo-text span { color: var(--red); }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* Status */
  .status-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .status-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s ease;
  }
  .status-card.has-dupes {
    border-color: rgba(255,69,58,0.35);
    background: rgba(255,69,58,0.06);
  }
  .status-card.clean {
    border-color: rgba(48,209,88,0.25);
    background: rgba(48,209,88,0.04);
  }

  .status-icon {
    font-size: 28px;
    line-height: 1;
    flex-shrink: 0;
  }
  .status-info { flex: 1; min-width: 0; }
  .status-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 2px;
  }
  .status-card.has-dupes .status-title { color: var(--red); }
  .status-card.clean .status-title { color: var(--green); }
  .status-subtitle {
    font-size: 11px;
    color: var(--muted);
  }

  /* Duplicate list */
  .dupes-section {
    padding: 0 16px 14px;
  }
  .section-label {
    font-size: 10px;
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-top: 14px;
  }

  .dupe-list { display: flex; flex-direction: column; gap: 6px; }

  .dupe-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    display: flex;
    align-items: center;
    gap: 9px;
    transition: border-color 0.15s, background 0.15s;
  }
  .dupe-item:hover {
    border-color: rgba(255,69,58,0.3);
    background: var(--surface2);
  }

  .dupe-favicon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 3px;
  }
  .dupe-favicon-fallback {
    width: 16px;
    height: 16px;
    background: var(--surface2);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--muted);
  }
  .dupe-info { flex: 1; min-width: 0; }
  .dupe-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dupe-window {
    font-size: 10px;
    color: var(--muted);
    margin-top: 1px;
  }

  .dupe-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .btn-icon {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { background: #333; border-color: rgba(255,255,255,0.15); }
  .btn-icon.danger:hover { background: rgba(255,69,58,0.2); border-color: rgba(255,69,58,0.4); }

  /* Stats */
  .stats-section {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: linear-gradient(135deg, #0f0f0f 0%, #0a0a0a 100%);
    display: flex;
    gap: 10px;
  }
  .stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--red);
    line-height: 1;
    margin-bottom: 3px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.3;
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 24px 16px;
    color: var(--muted);
    font-size: 12px;
  }
  .empty-icon { font-size: 32px; margin-bottom: 8px; }

  /* Loading */
  .loading {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
  }

  .current-url {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo-row">
    <span class="logo-icon">🪃</span>
    <span class="logo-text">Tab<span>Bouncer</span></span>
  </div>
  <div class="tagline">// no more dupe tabs, hoarder</div>
</div>

<div class="status-section">
  <div class="status-card" id="statusCard">
    <div class="status-icon" id="statusIcon">⏳</div>
    <div class="status-info">
      <div class="status-title" id="statusTitle">Checking...</div>
      <div class="status-subtitle" id="statusSub"></div>
    </div>
  </div>
</div>

<div id="mainContent"></div>

<div class="stats-section">
  <div class="stat">
    <div class="stat-num" id="statCaught">–</div>
    <div class="stat-label">Dupes caught</div>
  </div>
  <div class="stat">
    <div class="stat-num" id="statJumped">–</div>
    <div class="stat-label">Tabs jumped to</div>
  </div>
</div>

<script>
const statusCard = document.getElementById('statusCard');
const statusIcon = document.getElementById('statusIcon');
const statusTitle = document.getElementById('statusTitle');
const statusSub = document.getElementById('statusSub');
const mainContent = document.getElementById('mainContent');

function truncate(str, n) {
  return str && str.length > n ? str.slice(0, n) + '…' : (str || '');
}

// Load stats
chrome.runtime.sendMessage({ type: 'GET_STATS' }, ({ stats }) => {
  document.getElementById('statCaught').textContent = stats.duplicatesCaught || 0;
  document.getElementById('statJumped').textContent = stats.tabsJumpedTo || 0;
});

// Load duplicates for current tab
chrome.runtime.sendMessage({ type: 'GET_DUPLICATES' }, ({ dupes, currentTabId }) => {
  if (!dupes || dupes.length === 0) {
    statusCard.classList.add('clean');
    statusIcon.textContent = '✅';
    statusTitle.textContent = 'You\'re good!';
    statusSub.textContent = 'No duplicate tabs found';
    mainContent.innerHTML = '';
  } else {
    statusCard.classList.add('has-dupes');
    statusIcon.textContent = '🚨';
    statusTitle.textContent = `${dupes.length} duplicate${dupes.length > 1 ? 's' : ''} found`;
    statusSub.textContent = `This page is already open elsewhere`;

    // Build list
    const section = document.createElement('div');
    section.className = 'dupes-section';
    section.innerHTML = `<div class="section-label">Open duplicates</div><div class="dupe-list" id="dupeList"></div>`;
    mainContent.appendChild(section);

    const list = section.querySelector('#dupeList');
    dupes.forEach((tab, i) => {
      const item = document.createElement('div');
      item.className = 'dupe-item';

      const faviconHtml = tab.favIconUrl
        ? `<img class="dupe-favicon" src="${tab.favIconUrl}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" /><div class="dupe-favicon-fallback" style="display:none">🌐</div>`
        : `<div class="dupe-favicon-fallback">🌐</div>`;

      item.innerHTML = `
        ${faviconHtml}
        <div class="dupe-info">
          <div class="dupe-title" title="${tab.title || tab.url}">${truncate(tab.title || tab.url, 32)}</div>
          <div class="dupe-window">Tab ${i + 1}${tab.windowId ? ' · Window ' + (i + 1) : ''}</div>
        </div>
        <div class="dupe-actions">
          <button class="btn-icon" title="Switch to this tab" data-action="jump" data-id="${tab.id}" data-wid="${tab.windowId}">↗</button>
          <button class="btn-icon danger" title="Close this duplicate" data-action="closecurrent" data-id="${tab.id}" data-wid="${tab.windowId}" data-current="${currentTabId}">✕</button>
        </div>
      `;
      list.appendChild(item);
    });

    // Button handlers
    list.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const tabId = parseInt(btn.dataset.id);
      const windowId = parseInt(btn.dataset.wid);
      const currentTabId = parseInt(btn.dataset.current);

      if (action === 'jump') {
        chrome.runtime.sendMessage({ type: 'JUMP_TO_TAB', tabId, windowId });
        window.close();
      } else if (action === 'closecurrent') {
        chrome.runtime.sendMessage({ type: 'CLOSE_CURRENT_AND_JUMP', targetTabId: tabId, windowId, currentTabId });
        window.close();
      }
    });
  }
});
</script>
</body>
</html>
